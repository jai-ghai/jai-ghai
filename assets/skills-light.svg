  <title id="t">Skills</title>
  <desc id="d">AI and LLM: LLM integration, prompt engineering, RAG, vector search, embeddings, structured output, Gemini, Claude on Bedrock, Azure OpenAI. Backend: Python, FastAPI, Node.js, Express, Java, Spring Boot, REST APIs, JWT and RBAC. Data: PostgreSQL, pgvector, DynamoDB, MongoDB, SQL, Oracle. Cloud: AWS, GCP Cloud Run, Azure, Lambda, ECS, CloudFront, Media Services, CDK, CI/CD. Frontend: React, TypeScript, Tailwind CSS, Video.js.</desc>
