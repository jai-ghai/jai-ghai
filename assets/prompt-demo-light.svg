<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">Grounded question answering demo</title>
  <desc id="d">A prompt is typed, three sources are retrieved with relevance scores, then an answer streams in with citations to those sources.</desc>
  <style>
.m{font-family:'Geist Mono', 'Cascadia Mono', Consolas, monospace}
@keyframes tl0{0%,3%{opacity:0;transform:translateX(-10px)}6%,94%{opacity:1;transform:translateX(0)}97%,100%{opacity:0;transform:translateX(0)}}@keyframes tl1{0%,40%{opacity:0;transform:translateX(-10px)}43%,94%{opacity:1;transform:translateX(0)}97%,100%{opacity:0;transform:translateX(0)}}@keyframes tl2{0%,53%{opacity:0;transform:translateX(-10px)}56%,94%{opacity:1;transform:translateX(0)}97%,100%{opacity:0;transform:translateX(0)}}
.tl0{animation:tl0 18s cubic-bezier(0.16, 1, 0.3, 1) infinite}.tl1{animation:tl1 18s cubic-bezier(0.16, 1, 0.3, 1) infinite}.tl2{animation:tl2 18s cubic-bezier(0.16, 1, 0.3, 1) infinite}
@keyframes ch0{0%,21%{opacity:0}23%,94%{opacity:1}97%,100%{opacity:0}}@keyframes ch1{0%,25%{opacity:0}27%,94%{opacity:1}97%,100%{opacity:0}}@keyframes ch2{0%,29%{opacity:0}31%,94%{opacity:1}97%,100%{opacity:0}}
.ch0{animation:ch0 18s linear infinite}.ch1{animation:ch1 18s linear infinite}.ch2{animation:ch2 18s linear infinite}
@keyframes ci0{0%,68%{opacity:0}70%,94%{opacity:1}97%,100%{opacity:0}}@keyframes ci1{0%,71%{opacity:0}73%,94%{opacity:1}97%,100%{opacity:0}}@keyframes ci2{0%,74%{opacity:0}76%,94%{opacity:1}97%,100%{opacity:0}}
.ci0{animation:ci0 18s linear infinite}.ci1{animation:ci1 18s linear infinite}.ci2{animation:ci2 18s linear infinite}
@keyframes cl{0%,67%{opacity:0}69%,94%{opacity:1}97%,100%{opacity:0}}@keyframes nt{0%,78%{opacity:0}80%,94%{opacity:1}97%,100%{opacity:0}}
.cl{animation:cl 18s linear infinite}.nt{animation:nt 18s linear infinite}
@keyframes scan{0%,19%{transform:scaleX(0);opacity:1}33%{transform:scaleX(1);opacity:1}34%,100%{transform:scaleX(0);opacity:0}}
.scan{transform-box:fill-box;transform-origin:left center;animation:scan 18s linear infinite}
@media (prefers-reduced-motion: reduce){*{animation:none !important}}</style>
  <defs></defs>
  <rect width="1280" height="420" rx="28" fill="#F5F5F5"/><rect x="0.5" y="0.5" width="1279" height="419" rx="27.5" fill="none" stroke="#0A2540" stroke-opacity="0.12"/>
  <circle cx="64" cy="40" r="6" fill="#F9C642"/><circle cx="86" cy="40" r="6" fill="#0A2540" fill-opacity="0.25"/><circle cx="108" cy="40" r="6" fill="#0A2540" fill-opacity="0.25"/>
  <text class="m" x="140" y="45" font-size="14" fill="#333333" fill-opacity="0.8">grounded-qa  /  prompt, retrieve, answer</text>
  <line x1="64" y1="64" x2="1216" y2="64" stroke="#0A2540" stroke-opacity="0.14"/>
  <text class="m" x="64" y="90" font-size="12" letter-spacing="2" fill="#7A5800">PROMPT</text><text class="m tl0" x="64" y="112" font-size="22" fill="#0A2540" fill-opacity="1">&gt; Which AWS services give me low-latency live streaming with signed playback?</text>
  <text class="m" x="64" y="152" font-size="12" letter-spacing="2" fill="#7A5800">RETRIEVED</text>
  <g class="ch0"><rect x="64" y="166" width="291" height="32" rx="16" fill="#FFFFFF" fill-opacity="1" stroke="#7A5800" stroke-width="1.5"/><text class="m" x="78" y="187" font-size="14" fill="#0A2540">[1] streaming-guide.md  0.91</text></g><g class="ch1"><rect x="364" y="166" width="272" height="32" rx="16" fill="#FFFFFF" fill-opacity="1" stroke="#7A5800" stroke-width="1.5"/><text class="m" x="378" y="187" font-size="14" fill="#0A2540">[2] playback-auth.md  0.87</text></g><g class="ch2"><rect x="644" y="166" width="244" height="32" rx="16" fill="#FFFFFF" fill-opacity="1" stroke="#7A5800" stroke-width="1.5"/><text class="m" x="658" y="187" font-size="14" fill="#0A2540">[3] cost-notes.md  0.83</text></g>
  <rect class="scan" x="64" y="212" width="1160" height="3" rx="1.5" fill="#F9C642"/>
  <text class="m" x="64" y="240" font-size="12" letter-spacing="2" fill="#7A5800">ANSWER</text><text class="m tl1" x="64" y="262" font-size="20" fill="#0A2540" fill-opacity="0.95">MediaLive encodes the feed, MediaPackage packages low-latency HLS,</text><text class="m tl2" x="64" y="292" font-size="20" fill="#0A2540" fill-opacity="0.95">and CloudFront delivers it. Signed URLs and token checks gate playback.</text>
  <g class="cl"><text class="m" x="64" y="364" font-size="12" letter-spacing="2" fill="#7A5800">CITED</text></g>
  <g class="ci0"><rect x="64" y="316" width="36" height="26" rx="13" fill="#F9C642"/><text class="m" x="82" y="334" text-anchor="middle" font-size="14" font-weight="700" fill="#0A2540">[1]</text></g><g class="ci1"><rect x="108" y="316" width="36" height="26" rx="13" fill="#F9C642"/><text class="m" x="126" y="334" text-anchor="middle" font-size="14" font-weight="700" fill="#0A2540">[2]</text></g><g class="ci2"><rect x="152" y="316" width="36" height="26" rx="13" fill="#F9C642"/><text class="m" x="170" y="334" text-anchor="middle" font-size="14" font-weight="700" fill="#0A2540">[3]</text></g>
  <text class="nt" x="1216" y="334" text-anchor="end" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0A2540">Answers only from retrieved sources. Nothing else.</text>
</svg>
