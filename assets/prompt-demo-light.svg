<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">Grounded question answering demo</title>
  <desc id="d">A prompt is typed, three sources are retrieved with relevance scores, then an answer streams in with citations to those sources.</desc>
  <defs><clipPath id="p1"><rect x="64" y="86" width="0" height="40"><animate attributeName="width" dur="18s" repeatCount="indefinite" keyTimes="0;0.03;0.17;0.94;0.97;1" values="0;0;1160;1160;0;0"/></rect></clipPath><clipPath id="a1"><rect x="64" y="236" width="0" height="40"><animate attributeName="width" dur="18s" repeatCount="indefinite" keyTimes="0;0.4;0.52;0.94;0.97;1" values="0;0;1160;1160;0;0"/></rect></clipPath><clipPath id="a2"><rect x="64" y="266" width="0" height="40"><animate attributeName="width" dur="18s" repeatCount="indefinite" keyTimes="0;0.53;0.65;0.94;0.97;1" values="0;0;1160;1160;0;0"/></rect></clipPath></defs>
  <rect width="1280" height="420" rx="28" fill="#F5F5F5"/>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="27.5" fill="none" stroke="#0A2540" stroke-opacity="0.12"/>
  <circle cx="64" cy="40" r="6" fill="#F9C642"/><circle cx="86" cy="40" r="6" fill="#0A2540" fill-opacity="0.25"/><circle cx="108" cy="40" r="6" fill="#0A2540" fill-opacity="0.25"/>
  <text x="140" y="45" font-family="'Geist Mono', 'Cascadia Mono', Consolas, monospace" font-size="14" fill="#333333" fill-opacity="0.75">grounded-qa  /  prompt, retrieve, answer</text>
  <line x1="64" y1="64" x2="1216" y2="64" stroke="#0A2540" stroke-opacity="0.14"/>

  <text x="64" y="90" font-family="'Geist Mono', 'Cascadia Mono', Consolas, monospace" font-size="12" letter-spacing="2" fill="#F9C642">PROMPT</text>
  <text x="64" y="112" clip-path="url(#p1)" font-family="'Geist Mono', 'Cascadia Mono', Consolas, monospace" font-size="22" fill="#0A2540" fill-opacity="1">&gt; Which AWS services give me low-latency live streaming with signed playback?</text>

  <text x="64" y="152" font-family="'Geist Mono', 'Cascadia Mono', Consolas, monospace" font-size="12" letter-spacing="2" fill="#F9C642">RETRIEVED</text>
  <g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0;0.21;0.23;0.94;0.97;1" values="0;0;1;1;0;0"/><rect x="64" y="166" width="291.2" height="32" rx="16" fill="#FFFFFF" fill-opacity="1" stroke="#F9C642" stroke-width="1.5"/><text x="78" y="187" font-family="'Geist Mono', 'Cascadia Mono', Consolas, monospace" font-size="14" fill="#0A2540">[1] streaming-guide.md  0.91</text></g><g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0;0.25;0.27;0.94;0.97;1" values="0;0;1;1;0;0"/><rect x="364" y="166" width="272.4" height="32" rx="16" fill="#FFFFFF" fill-opacity="1" stroke="#F9C642" stroke-width="1.5"/><text x="378" y="187" font-family="'Geist Mono', 'Cascadia Mono', Consolas, monospace" font-size="14" fill="#0A2540">[2] playback-auth.md  0.87</text></g><g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0;0.29;0.31;0.94;0.97;1" values="0;0;1;1;0;0"/><rect x="644" y="166" width="244.20000000000002" height="32" rx="16" fill="#FFFFFF" fill-opacity="1" stroke="#F9C642" stroke-width="1.5"/><text x="658" y="187" font-family="'Geist Mono', 'Cascadia Mono', Consolas, monospace" font-size="14" fill="#0A2540">[3] cost-notes.md  0.83</text></g>
  <rect x="64" y="212" width="0" height="3" rx="1.5" fill="#F9C642">
    <animate attributeName="width" dur="18s" repeatCount="indefinite" keyTimes="0;0.19;0.33;0.34;1" values="0;0;1160;0;0"/>
  </rect>

  <text x="64" y="240" font-family="'Geist Mono', 'Cascadia Mono', Consolas, monospace" font-size="12" letter-spacing="2" fill="#F9C642">ANSWER</text>
  <text x="64" y="262" clip-path="url(#a1)" font-family="'Geist Mono', 'Cascadia Mono', Consolas, monospace" font-size="20" fill="#0A2540" fill-opacity="0.95">MediaLive encodes the feed, MediaPackage packages low-latency HLS,</text><text x="64" y="292" clip-path="url(#a2)" font-family="'Geist Mono', 'Cascadia Mono', Consolas, monospace" font-size="20" fill="#0A2540" fill-opacity="0.95">and CloudFront delivers it. Signed URLs and token checks gate playback.</text>

  <text x="64" y="364" font-family="'Geist Mono', 'Cascadia Mono', Consolas, monospace" font-size="12" letter-spacing="2" fill="#F9C642" opacity="0">CITED<animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0;0.67;0.69;0.94;0.97;1" values="0;0;1;1;0;0"/></text>
  <g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0;0.68;0.7;0.94;0.97;1" values="0;0;1;1;0;0"/><rect x="64" y="316" width="36" height="26" rx="13" fill="#F9C642"/><text x="82" y="334" text-anchor="middle" font-family="'Geist Mono', 'Cascadia Mono', Consolas, monospace" font-size="14" font-weight="700" fill="#0A2540">[1]</text></g><g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0;0.71;0.73;0.94;0.97;1" values="0;0;1;1;0;0"/><rect x="108" y="316" width="36" height="26" rx="13" fill="#F9C642"/><text x="126" y="334" text-anchor="middle" font-family="'Geist Mono', 'Cascadia Mono', Consolas, monospace" font-size="14" font-weight="700" fill="#0A2540">[2]</text></g><g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0;0.74;0.76;0.94;0.97;1" values="0;0;1;1;0;0"/><rect x="152" y="316" width="36" height="26" rx="13" fill="#F9C642"/><text x="170" y="334" text-anchor="middle" font-family="'Geist Mono', 'Cascadia Mono', Consolas, monospace" font-size="14" font-weight="700" fill="#0A2540">[3]</text></g>
  <g opacity="0"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" keyTimes="0;0.78;0.8;0.94;0.97;1" values="0;0;1;1;0;0"/>
    <text x="1216" y="334" text-anchor="end" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0A2540">Answers only from retrieved sources. Nothing else.</text>
