<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
  <title id="t">Jai Ghai</title>
  <desc id="d">Software Engineer, AI Platforms and Cloud. Animated lines cycle through: RAG search, LLM pipelines, secure APIs.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0A2540" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="c1"><rect x="64" y="256" width="0" height="40"><animate attributeName="width" dur="15s" repeatCount="indefinite" keyTimes="0;0.02;0.12;0.30;0.32;1" values="0;0;760;760;0;0"/></rect></clipPath>
    <clipPath id="c2"><rect x="64" y="256" width="0" height="40"><animate attributeName="width" dur="15s" repeatCount="indefinite" keyTimes="0;0.34;0.45;0.63;0.65;1" values="0;0;760;760;0;0"/></rect></clipPath>
    <clipPath id="c3"><rect x="64" y="256" width="0" height="40"><animate attributeName="width" dur="15s" repeatCount="indefinite" keyTimes="0;0.67;0.78;0.96;0.98;1" values="0;0;760;760;0;0"/></rect></clipPath>
  </defs>

  <rect width="1280" height="340" rx="28" fill="#F5F5F5"/>
  <rect width="1280" height="340" rx="28" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1279" height="339" rx="27.5" fill="none" stroke="#0A2540" stroke-opacity="0.12"/>

  <rect x="64" y="64" width="56" height="6" rx="3" fill="#F9C642">
    <animate attributeName="width" values="56;120;56" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="64" y="150" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-2" fill="#0A2540">Jai Ghai</text>
  <text x="64" y="200" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#1A3A5C">Software Engineer · AI Platforms &amp; Cloud</text>

  <g font-family="'Geist Mono', 'Cascadia Mono', Consolas, monospace" font-size="20" fill="#333333">
    <text x="64" y="282" clip-path="url(#c1)">&gt; rag search that answers only from what it retrieved</text>
    <text x="64" y="282" clip-path="url(#c2)">&gt; llm pipelines: transcript in, structured report out</text>
    <text x="64" y="282" clip-path="url(#c3)">&gt; secure apis with rbac and tenant isolation</text>
  </g>

  <g transform="translate(960 50)" fill="none" stroke="#0A2540">
    <g stroke-width="1.5" stroke-dasharray="6 8" stroke-opacity="0.45">
      <path d="M70 110L135 150">
        <animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.6s" repeatCount="indefinite"/>
      </path>
      <path d="M210 70L150 138">
        <animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.3s" repeatCount="indefinite"/>
      </path>
      <path d="M215 235L160 172">
        <animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.9s" repeatCount="indefinite"/>
      </path>
      <path d="M85 240L128 178">
        <animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.5s" repeatCount="indefinite"/>
      </path>
    </g>
    <circle cx="145" cy="160" r="30" stroke-width="2">
      <animate attributeName="r" values="30;36;30" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="145" cy="160" r="12" fill="#F9C642" stroke="none"/>
    <g stroke-width="2" stroke-opacity="0.65">
      <circle cx="62" cy="100" r="10"><animate attributeName="cy" values="100;108;100" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="218" cy="62" r="10"><animate attributeName="cy" values="62;70;62" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="222" cy="244" r="10"><animate attributeName="cy" values="244;236;244" dur="4.5s" repeatCount="indefinite"/></circle>
      <circle cx="78" cy="250" r="10"><animate attributeName="cy" values="250;242;250" dur="3.5s" repeatCount="indefinite"/></circle>
    </g>
  </g>
</svg>
