<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
  <title id="t">Jai Ghai</title>
  <desc id="d">Software Engineer, AI Platforms and Cloud. Animated lines cycle through: RAG search, LLM pipelines, secure APIs.</desc>
  <style>
.tx{font-family:'Geist Mono', 'Cascadia Mono', Consolas, monospace;font-size:20px}
@keyframes ty0{0%,2%{clip-path:inset(-6px 100% -6px -2px);animation-timing-function:steps(52,end)}12%,94%{clip-path:inset(-6px -2px -6px -2px)}97%,100%{clip-path:inset(-6px 100% -6px -2px)}}@keyframes ty1{0%,34%{clip-path:inset(-6px 100% -6px -2px);animation-timing-function:steps(52,end)}45%,94%{clip-path:inset(-6px -2px -6px -2px)}97%,100%{clip-path:inset(-6px 100% -6px -2px)}}@keyframes ty2{0%,67%{clip-path:inset(-6px 100% -6px -2px);animation-timing-function:steps(43,end)}78%,94%{clip-path:inset(-6px -2px -6px -2px)}97%,100%{clip-path:inset(-6px 100% -6px -2px)}}
.l0{animation:ty0 15s linear infinite}.l1{animation:ty1 15s linear infinite}.l2{animation:ty2 15s linear infinite}
@keyframes bar{0%,100%{transform:scaleX(1)}50%{transform:scaleX(2.1)}}
.bar{transform-box:fill-box;transform-origin:left center;animation:bar 4s cubic-bezier(0.16, 1, 0.3, 1) infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
.f1{animation:fl 4s ease-in-out infinite}.f2{animation:fl 5s ease-in-out infinite reverse}.f3{animation:fl 4.5s ease-in-out infinite}.f4{animation:fl 3.5s ease-in-out infinite reverse}
@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.pu{transform-box:fill-box;transform-origin:center;animation:pu 3s ease-in-out infinite}
@keyframes fw{to{stroke-dashoffset:-28}}
.fw{stroke-dasharray:6 8;animation:fw 1.6s linear infinite}
@media (prefers-reduced-motion: reduce){*{animation:none !important}.alt{display:none}}</style>
  <defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#0A2540" stroke-opacity="0.06"/></pattern></defs>
  <rect width="1280" height="340" rx="28" fill="#F5F5F5"/><rect x="0.5" y="0.5" width="1279" height="339" rx="27.5" fill="none" stroke="#0A2540" stroke-opacity="0.12"/>
  <rect width="1280" height="340" rx="28" fill="url(#grid)"/>
  <rect class="bar" x="64" y="64" width="56" height="6" rx="3" fill="#F9C642"/>
  <text x="64" y="150" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-2" fill="#0A2540">Jai Ghai</text>
  <text x="64" y="200" font-family="Geist, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#1A3A5C">Software Engineer · AI Platforms &amp; Cloud</text>
  <text class="tx l0" x="64" y="282" fill="#333333" fill-opacity="0.8">&gt; rag search that answers only from what it retrieved</text><text class="tx l1 alt" x="64" y="282" fill="#333333" fill-opacity="0.8">&gt; llm pipelines: transcript in, structured report out</text><text class="tx l2 alt" x="64" y="282" fill="#333333" fill-opacity="0.8">&gt; secure apis with rbac and tenant isolation</text>
  <g transform="translate(960 50)" fill="none" stroke="#0A2540">
    <g stroke-width="1.5" stroke-opacity="0.5">
      <path class="fw" d="M70 110L135 150"/><path class="fw" d="M210 70L150 138"/><path class="fw" d="M215 235L160 172"/><path class="fw" d="M85 240L128 178"/>
    </g>
    <circle class="pu" cx="145" cy="160" r="30" stroke-width="2"/>
    <circle cx="145" cy="160" r="12" fill="#F9C642" stroke="none"/>
    <g stroke-width="2" stroke-opacity="0.7"><circle class="f1" cx="62" cy="100" r="10"/><circle class="f2" cx="218" cy="62" r="10"/><circle class="f3" cx="222" cy="244" r="10"/><circle class="f4" cx="78" cy="250" r="10"/></g>
  </g>
</svg>
